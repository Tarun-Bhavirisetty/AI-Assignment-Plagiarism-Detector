version: '3.8'

services:
  db:
    image: postgres:15
    container_name: metaguard-db
    environment:
      POSTGRES_USER: metaguard_user
      POSTGRES_PASSWORD: metaguard_password
      POSTGRES_DB: metaguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
